name: Delta.Maths benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite to run
        required: true
        default: performance
        type: choice
        options:
          - performance
          - version-comparison
      baseline_ref:
        description: Baseline branch, tag, or commit; used by version-comparison
        required: false
        default: ''
        type: string
      candidate_ref:
        description: Candidate branch, tag, or commit; empty uses this workflow revision
        required: false
        default: ''
        type: string
      warmup_count:
        description: BenchmarkDotNet warmup iterations
        required: true
        default: 3
        type: number
      iteration_count:
        description: BenchmarkDotNet measured iterations
        required: true
        default: 5
        type: number
      launch_count:
        description: BenchmarkDotNet process launches
        required: true
        default: 1
        type: number
      filter:
        description: BenchmarkDotNet filter
        required: true
        default: '*'
        type: string

permissions:
  contents: read

concurrency:
  group: delta-maths-benchmarks-${{ inputs.suite }}-${{ inputs.baseline_ref }}-${{ inputs.candidate_ref }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  performance:
    if: inputs.suite == 'performance'
    name: Standalone Delta.Maths performance
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v7

      - name: Install .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: delta-maths-performance-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            delta-maths-performance-${{ runner.os }}-

      - name: Restore
        run: |
          dotnet restore Delta.Maths.csproj \
            --disable-parallel --disable-build-servers --ignore-failed-sources \
            -m:1 -p:NuGetAudit=false
          dotnet restore Tests/Delta.Maths.Tests.csproj \
            --disable-parallel --disable-build-servers --ignore-failed-sources \
            -m:1 -p:NuGetAudit=false
          dotnet restore Benchmarks/Delta.Maths.Benchmarks.csproj \
            --disable-parallel --disable-build-servers --ignore-failed-sources \
            -m:1 -p:NuGetAudit=false

      - name: Build library, tests, and benchmarks
        run: |
          dotnet build Delta.Maths.csproj -c Release --no-restore
          dotnet build Tests/Delta.Maths.Tests.csproj -c Release --no-restore
          dotnet build Benchmarks/Delta.Maths.Benchmarks.csproj -c Release --no-restore

      - name: Run correctness executable
        run: dotnet run --project Tests/Delta.Maths.Tests.csproj -c Release --no-build --no-restore

      - name: Record runner
        env:
          BENCHMARK_FILTER: ${{ inputs.filter }}
          BENCHMARK_WARMUP_COUNT: ${{ inputs.warmup_count }}
          BENCHMARK_ITERATION_COUNT: ${{ inputs.iteration_count }}
          BENCHMARK_LAUNCH_COUNT: ${{ inputs.launch_count }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/performance
          {
            echo "suite=performance"
            echo "commit=${GITHUB_SHA}"
            echo "warmup_count=$BENCHMARK_WARMUP_COUNT"
            echo "iteration_count=$BENCHMARK_ITERATION_COUNT"
            echo "launch_count=$BENCHMARK_LAUNCH_COUNT"
            echo "filter=$BENCHMARK_FILTER"
            uname -a
            dotnet --info
          } > artifacts/performance/runner.txt

      - name: Run standalone performance suite
        env:
          BENCHMARK_FILTER: ${{ inputs.filter }}
          BENCHMARK_WARMUP_COUNT: ${{ inputs.warmup_count }}
          BENCHMARK_ITERATION_COUNT: ${{ inputs.iteration_count }}
          BENCHMARK_LAUNCH_COUNT: ${{ inputs.launch_count }}
        run: |
          dotnet Benchmarks/bin/Release/net8.0/Delta.Maths.Benchmarks.dll \
            --filter "$BENCHMARK_FILTER" \
            --warmupCount "$BENCHMARK_WARMUP_COUNT" \
            --iterationCount "$BENCHMARK_ITERATION_COUNT" \
            --launchCount "$BENCHMARK_LAUNCH_COUNT" \
            --exporters json csv markdown github \
            --artifacts artifacts/performance

      - name: Add performance to workflow summary
        if: always()
        env:
          BENCHMARK_FILTER: ${{ inputs.filter }}
          BENCHMARK_WARMUP_COUNT: ${{ inputs.warmup_count }}
          BENCHMARK_ITERATION_COUNT: ${{ inputs.iteration_count }}
          BENCHMARK_LAUNCH_COUNT: ${{ inputs.launch_count }}
        shell: bash
        run: |
          {
            echo "## Delta.Maths standalone performance"
            echo
            echo "Commit: [${GITHUB_SHA}](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA})"
            echo
            echo "This suite measures Delta.Maths only; it does not compare another implementation or revision."
            echo
            echo "Parameters: warmup=$BENCHMARK_WARMUP_COUNT, iterations=$BENCHMARK_ITERATION_COUNT, launches=$BENCHMARK_LAUNCH_COUNT, filter=\`$BENCHMARK_FILTER\`"
            echo
            if compgen -G 'artifacts/performance/*-report-github.md' > /dev/null; then
              for report in artifacts/performance/*-report-github.md; do
                cat "$report"
                echo
              done
            else
              echo "BenchmarkDotNet did not produce a GitHub markdown report. Full artifacts are uploaded below."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delta-maths-performance-${{ runner.arch }}-${{ github.run_number }}
          path: artifacts/performance
          if-no-files-found: warn
          retention-days: 30

  version-comparison:
    if: inputs.suite == 'version-comparison'
    name: Compare two Delta.Maths revisions
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      HARNESS_ROOT: ${{ github.workspace }}/harness
      BASELINE_ROOT: ${{ github.workspace }}/baseline
      CANDIDATE_ROOT: ${{ github.workspace }}/candidate
    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@v7
        with:
          path: harness
          fetch-depth: 0

      - name: Resolve refs to full commit SHAs
        id: version-refs
        shell: bash
        env:
          BASELINE_REF_INPUT: ${{ inputs.baseline_ref }}
          CANDIDATE_REF_INPUT: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail

          resolve_ref() {
            local requested="$1"
            local candidate
            local resolved

            if [ -z "$requested" ]; then
              git -C "$HARNESS_ROOT" rev-parse --verify HEAD
              return
            fi

            for candidate in "$requested" "refs/remotes/origin/$requested" "refs/tags/$requested"; do
              if resolved="$(git -C "$HARNESS_ROOT" rev-parse --verify --end-of-options "${candidate}^{commit}" 2>/dev/null)"; then
                printf '%s\n' "$resolved"
                return
              fi
            done

            echo "::error::Cannot resolve git ref '$requested' in the harness repository." >&2
            return 1
          }

          require_full_sha() {
            local name="$1"
            local value="$2"
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$name did not resolve to a full commit SHA: $value" >&2
              return 1
            fi
          }

          candidate_sha="$(resolve_ref "$CANDIDATE_REF_INPUT")"
          if [ -n "$BASELINE_REF_INPUT" ]; then
            baseline_sha="$(resolve_ref "$BASELINE_REF_INPUT")"
          else
            baseline_sha="$(git -C "$HARNESS_ROOT" rev-parse --verify --end-of-options "${candidate_sha}^")"
          fi
          require_full_sha baseline_sha "$baseline_sha"
          require_full_sha candidate_sha "$candidate_sha"

          baseline_subject="$(git -C "$HARNESS_ROOT" show -s --format=%s "$baseline_sha")"
          candidate_subject="$(git -C "$HARNESS_ROOT" show -s --format=%s "$candidate_sha")"
          echo "baseline_sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "baseline_subject=$baseline_subject" >> "$GITHUB_OUTPUT"
          echo "candidate_subject=$candidate_subject" >> "$GITHUB_OUTPUT"
          echo "Resolved baseline $baseline_sha -> candidate $candidate_sha"

      - name: Checkout baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version-refs.outputs.baseline_sha }}
          path: baseline
          fetch-depth: 1

      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version-refs.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 1

      - name: Install .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: delta-maths-version-${{ runner.os }}-${{ steps.version-refs.outputs.baseline_sha }}-${{ steps.version-refs.outputs.candidate_sha }}-${{ hashFiles('harness/VersionBenchmarks/**/*.csproj') }}
          restore-keys: |
            delta-maths-version-${{ runner.os }}-

      - name: Restore and build baseline and candidate libraries
        shell: bash
        run: |
          set -euo pipefail
          for root in "$BASELINE_ROOT" "$CANDIDATE_ROOT"; do
            dotnet restore "$root/Delta.Maths.csproj" \
              --disable-parallel --disable-build-servers --ignore-failed-sources \
              -m:1 -p:NuGetAudit=false
            dotnet build "$root/Delta.Maths.csproj" -c Release \
              --no-restore --disable-build-servers -m:1 /p:UseSharedCompilation=false
          done

      - name: Restore and build version benchmark harness
        working-directory: harness
        run: |
          dotnet restore VersionBenchmarks/Delta.Maths.VersionBenchmarks.csproj \
            --disable-parallel --disable-build-servers --ignore-failed-sources \
            -m:1 -p:NuGetAudit=false \
            -p:BaselineRoot="$BASELINE_ROOT" \
            -p:CandidateRoot="$CANDIDATE_ROOT"
          dotnet build VersionBenchmarks/Delta.Maths.VersionBenchmarks.csproj \
            -c Release --no-restore --disable-build-servers -m:1 \
            /p:UseSharedCompilation=false \
            -p:BaselineRoot="$BASELINE_ROOT" \
            -p:CandidateRoot="$CANDIDATE_ROOT"

      - name: Run contract smoke and discovery
        working-directory: harness
        run: |
          set -euo pipefail
          dotnet VersionBenchmarks/bin/Release/net8.0/Delta.Maths.VersionBenchmarks.dll smoke
          dotnet VersionBenchmarks/bin/Release/net8.0/Delta.Maths.VersionBenchmarks.dll \
            --list flat --filter '*'

      - name: Record resolved versions and runner
        working-directory: harness
        shell: bash
        env:
          BASELINE_SHA: ${{ steps.version-refs.outputs.baseline_sha }}
          CANDIDATE_SHA: ${{ steps.version-refs.outputs.candidate_sha }}
          BASELINE_SUBJECT: ${{ steps.version-refs.outputs.baseline_subject }}
          CANDIDATE_SUBJECT: ${{ steps.version-refs.outputs.candidate_subject }}
          BENCHMARK_FILTER: ${{ inputs.filter }}
          BENCHMARK_WARMUP_COUNT: ${{ inputs.warmup_count }}
          BENCHMARK_ITERATION_COUNT: ${{ inputs.iteration_count }}
          BENCHMARK_LAUNCH_COUNT: ${{ inputs.launch_count }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/version-comparison
          {
            echo "suite=version-comparison"
            echo "baseline_sha=$BASELINE_SHA"
            echo "baseline_subject=$BASELINE_SUBJECT"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "candidate_subject=$CANDIDATE_SUBJECT"
            echo "warmup_count=$BENCHMARK_WARMUP_COUNT"
            echo "iteration_count=$BENCHMARK_ITERATION_COUNT"
            echo "launch_count=$BENCHMARK_LAUNCH_COUNT"
            echo "filter=$BENCHMARK_FILTER"
            uname -a
            dotnet --info
          } > artifacts/version-comparison/runner.txt

      - name: Run version comparison suite
        working-directory: harness
        env:
          BENCHMARK_FILTER: ${{ inputs.filter }}
          BENCHMARK_WARMUP_COUNT: ${{ inputs.warmup_count }}
          BENCHMARK_ITERATION_COUNT: ${{ inputs.iteration_count }}
          BENCHMARK_LAUNCH_COUNT: ${{ inputs.launch_count }}
        run: |
          dotnet VersionBenchmarks/bin/Release/net8.0/Delta.Maths.VersionBenchmarks.dll \
            --filter "$BENCHMARK_FILTER" \
            --warmupCount "$BENCHMARK_WARMUP_COUNT" \
            --iterationCount "$BENCHMARK_ITERATION_COUNT" \
            --launchCount "$BENCHMARK_LAUNCH_COUNT" \
            --exporters json csv markdown github \
            --artifacts artifacts/version-comparison

      - name: Add comparison to workflow summary
        if: always()
        working-directory: harness
        shell: bash
        env:
          BASELINE_SHA: ${{ steps.version-refs.outputs.baseline_sha }}
          CANDIDATE_SHA: ${{ steps.version-refs.outputs.candidate_sha }}
          BASELINE_SUBJECT: ${{ steps.version-refs.outputs.baseline_subject }}
          CANDIDATE_SUBJECT: ${{ steps.version-refs.outputs.candidate_subject }}
          BENCHMARK_FILTER: ${{ inputs.filter }}
          BENCHMARK_WARMUP_COUNT: ${{ inputs.warmup_count }}
          BENCHMARK_ITERATION_COUNT: ${{ inputs.iteration_count }}
          BENCHMARK_LAUNCH_COUNT: ${{ inputs.launch_count }}
        run: |
          {
            echo "## Delta.Maths version comparison"
            echo
            echo "Baseline: [$BASELINE_SHA](https://github.com/${{ github.repository }}/commit/$BASELINE_SHA) — $BASELINE_SUBJECT"
            echo
            echo "Candidate: [$CANDIDATE_SHA](https://github.com/${{ github.repository }}/commit/$CANDIDATE_SHA) — $CANDIDATE_SUBJECT"
            echo
            echo "Parameters: warmup=$BENCHMARK_WARMUP_COUNT, iterations=$BENCHMARK_ITERATION_COUNT, launches=$BENCHMARK_LAUNCH_COUNT, filter=\`$BENCHMARK_FILTER\`"
            echo
            if compgen -G 'artifacts/version-comparison/*-report-github.md' > /dev/null; then
              for report in artifacts/version-comparison/*-report-github.md; do
                cat "$report"
                echo
              done
            else
              echo "BenchmarkDotNet did not produce a GitHub markdown report. Full artifacts are uploaded below."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload version comparison artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delta-maths-version-${{ runner.arch }}-${{ github.run_number }}
          path: harness/artifacts/version-comparison
          if-no-files-found: warn
          retention-days: 30
