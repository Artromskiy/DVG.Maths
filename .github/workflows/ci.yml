name: Build and tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: delta-maths-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: delta-maths-nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: delta-maths-nuget-${{ runner.os }}-
      - name: Restore and build
        run: |
          dotnet restore Delta.Maths.csproj
          dotnet restore Tests/Delta.Maths.Tests.csproj
          dotnet build Delta.Maths.csproj -c Release --no-restore
          dotnet build Tests/Delta.Maths.Tests.csproj -c Release --no-restore
      - name: Run correctness executable
        run: dotnet run --project Tests/Delta.Maths.Tests.csproj -c Release --no-build --no-restore
      - name: Benchmark discovery smoke
        shell: bash
        run: |
          mapfile -t projects < <(find . -type f -name '*.Benchmarks.csproj' | sort)
          for project in "${projects[@]}"; do
            dotnet run --project "$project" -c Release -- --list flat --filter '*'
          done
